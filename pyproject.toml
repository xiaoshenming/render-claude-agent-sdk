[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "manim-quality-platform"
version = "0.1.0"
description = "Independent quality platform for generated Manim code"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.128",
  "fastapi>=0.115,<0.116",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "requests>=2.32,<3",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manim_quality"]

[tool.hatch.build.targets.wheel.force-include]
"apps" = "apps"
"vendor/logic_engine_mvp_baseline/tools/logic_engine_mvp/__init__.py" = "tools/logic_engine_mvp/__init__.py"
"src/manim_quality/logic/_vendor_package_init.py" = "tools/logic_engine_mvp/logic_engine_mvp/__init__.py"
"vendor/layout_probe/probe_runner.txt" = "manim_quality/vendor/layout_probe_runner.txt"
"vendor/logic_engine_mvp_baseline/tools/logic_engine_mvp/logic_engine_mvp/logic_facts.py" = "tools/logic_engine_mvp/logic_engine_mvp/logic_facts.py"
"vendor/logic_engine_mvp_baseline/tools/logic_engine_mvp/logic_engine_mvp/review_input.py" = "tools/logic_engine_mvp/logic_engine_mvp/review_input.py"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", ".", "vendor/logic_engine_mvp_baseline"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  ".vendor",
  "vendor/logic_engine_mvp_baseline",
  "vendor/logic_self_audit_baseline",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
